networks:
  internal:
    driver: bridge
  public:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  clamav_data:
  clamav_socket:

secrets:
  postgres_password:
    file: ./secrets/postgres_password.txt

services:

  # ─── PUBLIC ENTRY POINT ───────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [public, internal]
    depends_on: [frontend, gateway]
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    networks: [internal]
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost/api
      - NEXT_PUBLIC_WS_URL=ws://localhost/ws
    restart: unless-stopped

  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    networks: [internal]
    environment:
      - PORT=8080
      - DATABASE_URL=postgres://app_rw:${DB_PASS:-gradepro_dev_password}@pgbouncer:5432/gradepro
      - REDIS_URL=redis://redis:6379
      - ORCHESTRATOR_URL=http://orchestrator:8001
      - PDF_SERVICE_URL=http://pdf_service:8003
      - JWT_RS256_PRIVATE_KEY_PATH=/run/secrets/jwt_private_key
      - ENVIRONMENT=${ENVIRONMENT:-development}
    depends_on: [redis, pgbouncer]
    restart: unless-stopped

  # ─── PYTHON SERVICES ──────────────────────────────────────────────
  orchestrator:
    build:
      context: ./services/orchestrator
      dockerfile: Dockerfile
    networks: [internal]
    environment:
      - DATABASE_URL=postgresql+asyncpg://app_rw:${DB_PASS:-gradepro_dev_password}@pgbouncer:5432/gradepro
      - REDIS_URL=redis://redis:6379
      - PDF_SERVICE_URL=http://pdf_service:8003
      - GOTENBERG_URL=http://gotenberg:3000
      - CLAMAV_SOCKET=/var/run/clamav/clamd.ctl
      - R2_ACCOUNT_ID=${R2_ACCOUNT_ID:-}
      - R2_ACCESS_KEY=${R2_ACCESS_KEY:-}
      - R2_SECRET_KEY=${R2_SECRET_KEY:-}
      - R2_BUCKET_ASSIGNMENTS=${R2_BUCKET_ASSIGNMENTS:-gradepro-assignments}
      - R2_BUCKET_REPORTS=${R2_BUCKET_REPORTS:-gradepro-reports}
      - R2_BUCKET_TEMPLATES=${R2_BUCKET_TEMPLATES:-gradepro-templates}
      - MODELS_DIR=/app/models
      - AI_DETECTION_REFER_THRESHOLD=${AI_DETECTION_REFER_THRESHOLD:-0.7}
      - PLAGIARISM_REFER_THRESHOLD=${PLAGIARISM_REFER_THRESHOLD:-20}
    volumes:
      - clamav_socket:/var/run/clamav:ro
      - ./shared/rubrics:/app/shared/rubrics:ro
      - ./models:/app/models:ro
    depends_on: [redis, pgbouncer, clamav]
    restart: unless-stopped

  pdf_service:
    build:
      context: ./services/pdf_service
      dockerfile: Dockerfile
    networks: [internal]
    environment:
      - GOTENBERG_URL=http://gotenberg:3000
      - R2_ACCOUNT_ID=${R2_ACCOUNT_ID:-}
      - R2_ACCESS_KEY=${R2_ACCESS_KEY:-}
      - R2_SECRET_KEY=${R2_SECRET_KEY:-}
      - R2_BUCKET_REPORTS=${R2_BUCKET_REPORTS:-gradepro-reports}
      - R2_BUCKET_TEMPLATES=${R2_BUCKET_TEMPLATES:-gradepro-templates}
    depends_on: [gotenberg]
    restart: unless-stopped

  # ─── CELERY WORKERS ───────────────────────────────────────────────
  celery_grading:
    build:
      context: ./services/orchestrator
      dockerfile: Dockerfile
    command: >
      celery -A app.celery_app worker
      -Q grading_queue
      --pool=gevent
      --concurrency=${CELERY_GRADING_CONCURRENCY:-15}
      --max-tasks-per-child=100
      --loglevel=info
    deploy:
      replicas: ${CELERY_GRADING_REPLICAS:-2}
    networks: [internal]
    environment:
      - DATABASE_URL=postgresql+asyncpg://app_rw:${DB_PASS:-gradepro_dev_password}@pgbouncer:5432/gradepro
      - REDIS_URL=redis://redis:6379
      - PDF_SERVICE_URL=http://pdf_service:8003
      - GOTENBERG_URL=http://gotenberg:3000
      - CLAMAV_SOCKET=/var/run/clamav/clamd.ctl
      - R2_ACCOUNT_ID=${R2_ACCOUNT_ID:-}
      - R2_ACCESS_KEY=${R2_ACCESS_KEY:-}
      - R2_SECRET_KEY=${R2_SECRET_KEY:-}
      - GEVENT_SUPPORT=True
      - LLM_CALL_TIMEOUT_SECONDS=${LLM_CALL_TIMEOUT_SECONDS:-25}
      - MODELS_DIR=/app/models
      - AI_DETECTION_REFER_THRESHOLD=${AI_DETECTION_REFER_THRESHOLD:-0.7}
      - PLAGIARISM_REFER_THRESHOLD=${PLAGIARISM_REFER_THRESHOLD:-20}
    volumes:
      - clamav_socket:/var/run/clamav:ro
      - ./shared/rubrics:/app/shared/rubrics:ro
      - ./models:/app/models:ro
    depends_on: [redis, pgbouncer, clamav]
    restart: unless-stopped

  celery_analysis:
    build:
      context: ./services/orchestrator
      dockerfile: Dockerfile
    command: >
      celery -A app.celery_app worker
      -Q analysis_queue
      --pool=prefork
      --concurrency=${CELERY_ANALYSIS_CONCURRENCY:-1}
      --max-tasks-per-child=20
      --loglevel=info
    networks: [internal]
    environment:
      - DATABASE_URL=postgresql+asyncpg://app_rw:${DB_PASS:-gradepro_dev_password}@pgbouncer:5432/gradepro
      - REDIS_URL=redis://redis:6379
      - MODELS_DIR=/app/models
      - AI_DETECTION_REFER_THRESHOLD=${AI_DETECTION_REFER_THRESHOLD:-0.7}
      - PLAGIARISM_REFER_THRESHOLD=${PLAGIARISM_REFER_THRESHOLD:-20}
    volumes:
      - ./models:/app/models:ro
      - ./shared/rubrics:/app/shared/rubrics:ro
    depends_on: [redis, pgbouncer]
    restart: unless-stopped

  celery_training:
    build:
      context: ./services/orchestrator
      dockerfile: Dockerfile
    command: >
      celery -A app.celery_app worker
      -Q training_queue
      --pool=prefork
      --concurrency=${CELERY_TRAINING_CONCURRENCY:-2}
      --max-tasks-per-child=5
      --loglevel=info
    networks: [internal]
    environment:
      - DATABASE_URL=postgresql+asyncpg://app_rw:${DB_PASS:-gradepro_dev_password}@pgbouncer:5432/gradepro
      - REDIS_URL=redis://redis:6379
      - R2_ACCOUNT_ID=${R2_ACCOUNT_ID:-}
      - R2_ACCESS_KEY=${R2_ACCESS_KEY:-}
      - R2_SECRET_KEY=${R2_SECRET_KEY:-}
      - R2_BUCKET_MODELS=${R2_BUCKET_MODELS:-gradepro-models}
      - R2_BUCKET_TRAINING=${R2_BUCKET_TRAINING:-gradepro-training-data}
    cpus: "${TRAINING_CPU_LIMIT:-1.5}"
    depends_on: [redis, pgbouncer]
    restart: unless-stopped

  celery_pdf:
    build:
      context: ./services/orchestrator
      dockerfile: Dockerfile
    command: >
      celery -A app.celery_app worker
      -Q pdf_queue
      --pool=gevent
      --concurrency=${CELERY_PDF_CONCURRENCY:-10}
      --max-tasks-per-child=50
      --loglevel=info
    networks: [internal]
    environment:
      - DATABASE_URL=postgresql+asyncpg://app_rw:${DB_PASS:-gradepro_dev_password}@pgbouncer:5432/gradepro
      - REDIS_URL=redis://redis:6379
      - GOTENBERG_URL=http://gotenberg:3000
      - R2_ACCOUNT_ID=${R2_ACCOUNT_ID:-}
      - R2_ACCESS_KEY=${R2_ACCESS_KEY:-}
      - R2_SECRET_KEY=${R2_SECRET_KEY:-}
      - GEVENT_SUPPORT=True
    depends_on: [redis, pgbouncer, gotenberg]
    restart: unless-stopped

  celery_beat:
    build:
      context: ./services/orchestrator
      dockerfile: Dockerfile
    command: celery -A app.celery_app beat --loglevel=info
    networks: [internal]
    environment:
      - DATABASE_URL=postgresql+asyncpg://app_rw:${DB_PASS:-gradepro_dev_password}@pgbouncer:5432/gradepro
      - REDIS_URL=redis://redis:6379
    depends_on: [redis, pgbouncer]
    restart: unless-stopped

  # ─── DATA LAYER ───────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: gradepro
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./shared/db/init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    networks: [internal]
    shm_size: 256m
    command: >
      postgres
      -c max_connections=25
      -c shared_buffers=256MB
      -c effective_cache_size=512MB
      -c work_mem=16MB
      -c wal_level=replica
      -c log_min_duration_statement=1000
    restart: unless-stopped
    secrets: [postgres_password]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d gradepro"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgbouncer:
    image: edoburu/pgbouncer:latest
    volumes:
      - ./infra/pgbouncer/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
      - ./infra/pgbouncer/userlist.txt:/etc/pgbouncer/userlist.txt:ro
    networks: [internal]
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: >
      redis-server
      --appendonly yes
      --appendfsync everysec
      --maxmemory ${REDIS_MAX_MEMORY:-512mb}
      --maxmemory-policy allkeys-lru
      --save 60 1000
    volumes:
      - redis_data:/data
    networks: [internal]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── SECURITY ─────────────────────────────────────────────────────
  clamav:
    image: clamav/clamav:latest
    volumes:
      - clamav_data:/var/lib/clamav
      - clamav_socket:/var/run/clamav
    mem_limit: ${CLAMAV_MEM_LIMIT:-1g}
    networks: [internal]
    restart: unless-stopped

  # ─── PDF CONVERSION ───────────────────────────────────────────────
  gotenberg:
    image: gotenberg/gotenberg:8
    command:
      - "gotenberg"
      - "--api-timeout=${GOTENBERG_TIMEOUT:-30s}"
    mem_limit: ${GOTENBERG_MEM_LIMIT:-2g}
    networks: [internal]
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID]
    tmpfs:
      - /tmp:size=512m,noexec
    restart: unless-stopped

  # ─── MONITORING ───────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.53.0
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks: [internal]
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.0.0
    volumes:
      - ./infra/grafana:/var/lib/grafana
    networks: [internal]
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    restart: unless-stopped
